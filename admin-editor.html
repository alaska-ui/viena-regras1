<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viena — Editor Visual</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--ed-bg:#090909;--ed-panel:#121212;--ed-panel2:#181818;--ed-line:#292929;--ed-text:#f5f5f5;--ed-muted:#a4a4a4;--ed-accent:#e50914}
*{box-sizing:border-box}body{margin:0;background:var(--ed-bg);color:var(--ed-text);font-family:Arial,sans-serif;overflow:hidden}.editor{height:100vh;display:grid;grid-template-columns:390px 1fr;grid-template-rows:64px 1fr}.ed-top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--ed-line);background:#0d0d0d}.ed-top h1{font-size:15px;margin:0}.ed-top small{color:var(--ed-muted)}.spacer{flex:1}.btn{border:1px solid var(--ed-line);background:#171717;color:#fff;border-radius:8px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:#555}.btn.primary{background:var(--ed-accent);border-color:var(--ed-accent)}.ed-side{overflow:auto;border-right:1px solid var(--ed-line);padding:16px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{flex:1;padding:9px 6px;background:#171717;border:1px solid var(--ed-line);color:#bbb;border-radius:7px;cursor:pointer}.tab.active{background:#242424;color:#fff;border-color:#555}.panel{display:none}.panel.active{display:block}.group{border:1px solid var(--ed-line);border-radius:10px;margin-bottom:10px;background:var(--ed-panel);overflow:hidden}.group summary{padding:12px;font-weight:700;cursor:pointer}.fields{padding:0 12px 12px}.field{margin:11px 0}.field label{display:block;font-size:11px;color:#aaa;margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;border:1px solid #303030;background:#0b0b0b;color:#fff;border-radius:7px;padding:9px;outline:none}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ed-accent)}.check{display:flex;align-items:center;gap:8px}.check label{margin:0;text-transform:none;font-size:13px}.ed-preview{background:#202020;padding:16px;overflow:hidden}.preview-wrap{height:100%;border:1px solid #3a3a3a;border-radius:12px;overflow:hidden;background:#111;box-shadow:0 15px 50px #000}.preview-bar{height:34px;background:#151515;border-bottom:1px solid #333;display:flex;align-items:center;gap:7px;padding:0 12px}.dot{width:8px;height:8px;border-radius:50%;background:#555}.preview-label{margin-left:7px;color:#888;font-size:11px}.preview-frame{width:100%;height:calc(100% - 34px);border:0;background:#000}.hint{font-size:11px;color:#777;line-height:1.4}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cat-item,.rule-item{border:1px solid #303030;border-radius:8px;padding:10px;margin-bottom:8px;background:#101010}.cat-head,.rule-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cat-head strong,.rule-head strong{font-size:12px}.mini{padding:6px 8px;font-size:11px}.danger{color:#ff7070}.notice{position:fixed;bottom:15px;left:410px;background:#171717;border:1px solid #333;border-radius:9px;padding:10px 14px;font-size:12px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.notice.show{opacity:1;transform:none}.file-row{display:flex;gap:6px}.file-row input[type=file]{font-size:11px}
@media(max-width:900px){.editor{grid-template-columns:1fr;grid-template-rows:64px 48vh 52vh}.ed-side{border-right:0;border-bottom:1px solid var(--ed-line)}.ed-preview{padding:8px}.notice{left:15px}}
</style>
</head>
<body>
<div class="editor">
<header class="ed-top"><div><h1>VIENA — EDITOR VISUAL</h1><small>Edite e veja a mudança na hora</small></div><div class="spacer"></div><button class="btn" id="loadBtn">↻ Recarregar</button><button class="btn" id="draftBtn">💾 Rascunho</button><button class="btn" id="adminBtn">Abrir Admin</button><button class="btn primary" id="downloadBtn">Baixar JSON</button></header>
<aside class="ed-side">
<div class="tabs"><button class="tab active" data-tab="site">Site</button><button class="tab" data-tab="rules">Regras</button></div>
<div class="panel active" id="panel-site"></div><div class="panel" id="panel-rules"></div>
<p class="hint">A prévia usa o mesmo index.html, style.css e app.js do site. As alterações são apenas um rascunho no navegador até você baixar/salvar os JSONs.</p>
</aside>
<main class="ed-preview"><div class="preview-wrap"><div class="preview-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="preview-label">prévia real — viena roleplay</span></div><iframe class="preview-frame" id="preview" src="index.html"></iframe></div></main>
</div><div class="notice" id="notice"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let site={},data={};
const defaults={theme:{accent:'#e50914',accent_light:'#ff4650',background:'#090909',surface:'#121212',text:'#f5f5f5',muted:'#9b9b9b'},layout:{show_search:true,show_updates:true,show_notice:true,show_hero_image:true,show_admin_link:false},cursor:{enabled:true,size:34,trail_enabled:true,trail_type:'paint',trail_color:'#e50914',trail_count:10,falling_particles:{enabled:true,type:'letters',color:'#e50914',count:34,size:14}}};
function merge(a,b){return {...b,...a,theme:{...b.theme,...(a.theme||{})},layout:{...b.layout,...(a.layout||{})},cursor:{...b.cursor,...(a.cursor||{}),falling_particles:{...b.cursor.falling_particles,...(a.cursor?.falling_particles||{})}}}}
async function load(){
 try{const [s,r]=await Promise.all([fetch('content/site.json?x='+Date.now()).then(x=>x.json()),fetch('content/rules.json?x='+Date.now()).then(x=>x.json())]);site=merge(s,defaults);data=r||{categories:[],updates:[]};
 const saved=localStorage.getItem('viena-editor-draft');if(saved){const d=JSON.parse(saved);site=d.site||site;data=d.data||data;notice('Rascunho carregado.');}
 render();send();}catch(e){console.error(e);notice('Não consegui carregar os JSONs.');}}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function field(label,path,type='text',extra=''){const val=get(path);return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea data-path="${path}">${esc(val)}</textarea>`:type==='check'?`<div class="check"><input type="checkbox" data-path="${path}" ${val?'checked':''}><label>Ativado</label></div>`:type==='select'?`<select data-path="${path}">${extra.split('|').map(x=>{let [v,l]=x.split(':');return `<option value="${v}" ${String(val)==v?'selected':''}>${l}</option>`}).join('')}</select>`:`<input data-path="${path}" value="${esc(val)}">`}</div>`}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],site)??''}
function set(path,val){let p=path.split('.'),o=site;for(let i=0;i<p.length-1;i++){if(!o[p[i]])o[p[i]]={};o=o[p[i]]}o[p.at(-1)]=val}
function render(){
 $('#panel-site').innerHTML=`<details class="group" open><summary>🏠 Capa e identidade</summary><div class="fields">${field('Nome da cidade','site_name')}${field('Título principal','site_title')}${field('Bordão','tagline')}${field('Descrição','description','textarea')}${field('Logo','logo')}${field('Favicon','favicon')}${field('Discord','discord_url')}${field('Texto pequeno','hero_eyebrow')}${field('Título da capa','hero_title')}${field('Texto da capa','hero_text','textarea')}${field('Imagem da capa','hero_image')}${field('Título do aviso','notice_title')}${field('Texto do aviso','notice_text','textarea')}${field('Rodapé','footer_text')}</div></details>
 <details class="group"><summary>🎨 Cores</summary><div class="fields">${['accent','accent_light','background','surface','text','muted'].map(x=>field(x,'theme.'+x)).join('')}</div></details>
 <details class="group"><summary>👁️ Elementos</summary><div class="fields">${['show_search','show_updates','show_notice','show_hero_image','show_admin_link'].map(x=>field(x,'layout.'+x,'check')).join('')}</div></details>
 <details class="group"><summary>🖱️ Cursor e rastro</summary><div class="fields">${field('Cursor ativo','cursor.enabled','check')}${field('Imagem do cursor','cursor.image')}${field('Tamanho','cursor.size')}${field('Rastro ativo','cursor.trail_enabled','check')}${field('Tipo do rastro','cursor.trail_type','select','paint:Pincelada|spray:Spray|glow:Glow')}${field('Cor','cursor.trail_color')}${field('Partículas do rastro','cursor.trail_count')}</div></details>
 <details class="group"><summary>✨ Partículas caindo</summary><div class="fields">${field('Ativar','cursor.falling_particles.enabled','check')}${field('Tipo','cursor.falling_particles.type','select','letters:Letras|logo:Logo|mixed:Misto|spark:Brilhos')}${field('Logo','cursor.falling_particles.image')}${field('Cor','cursor.falling_particles.color')}${field('Quantidade','cursor.falling_particles.count')}${field('Tamanho','cursor.falling_particles.size')}</div></details>`;
 renderRules();bind();}
function renderRules(){let p=$('#panel-rules');p.innerHTML=`<details class="group" open><summary>📕 Categorias</summary><div class="fields"><button class="btn primary" id="addCat">+ Adicionar categoria</button><div id="cats"></div></div></details><details class="group"><summary>📝 Últimas alterações</summary><div class="fields"><button class="btn" id="addUpd">+ Adicionar alteração</button><div id="updates"></div></div></details>`;let cats=$('#cats');(data.categories||[]).forEach((c,i)=>{let d=document.createElement('div');d.className='cat-item';d.innerHTML=`<div class="cat-head"><strong>${esc(c.code||'SEM CÓDIGO')} — ${esc(c.short||c.name||'Categoria')}</strong><button class="btn mini danger" data-del-cat="${i}">Excluir</button></div><div class="field"><label>ID</label><input data-cat="${i}" data-k="id" value="${esc(c.id||'')}"></div><div class="row"><div class="field"><label>Código</label><input data-cat="${i}" data-k="code" value="${esc(c.code||'')}"></div><div class="field"><label>Nome curto</label><input data-cat="${i}" data-k="short" value="${esc(c.short||'')}"></div></div><div class="field"><label>Nome</label><input data-cat="${i}" data-k="name" value="${esc(c.name||'')}"></div><div class="field"><label>Descrição</label><textarea data-cat="${i}" data-k="desc">${esc(c.desc||'')}</textarea></div><div class="field"><label>Imagem da categoria (URL/caminho)</label><input data-cat="${i}" data-k="image" value="${esc(c.image||'')}"></div><div class="rule-head"><strong>Regras (${(c.rules||[]).length})</strong><button class="btn mini" data-add-rule="${i}">+ Regra</button></div><div>${(c.rules||[]).map((r,j)=>`<div class="rule-item"><div class="rule-head"><strong>${esc(r.code||'')} — ${esc(r.title||'Sem título')}</strong><button class="btn mini danger" data-del-rule="${i}:${j}">Excluir</button></div><div class="row"><div class="field"><label>Código</label><input data-rule="${i}:${j}" data-k="code" value="${esc(r.code||'')}"></div><div class="field"><label>Tag</label><input data-rule="${i}:${j}" data-k="tag" value="${esc(r.tag||'REGRA')}"></div></div><div class="field"><label>Título</label><input data-rule="${i}:${j}" data-k="title" value="${esc(r.title||'')}"></div><div class="field"><label>Texto</label><textarea data-rule="${i}:${j}" data-k="text">${esc(r.text||'')}</textarea></div><div class="field"><label>Imagem</label><input data-rule="${i}:${j}" data-k="image" value="${esc(r.image||'')}"></div></div>`).join('')}</div></div>`;cats.appendChild(d)});let up=$('#updates');(data.updates||[]).forEach((u,i)=>{let d=document.createElement('div');d.className='cat-item';d.innerHTML=`<div class="row">${['date','title','text','tag'].map(k=>`<div class="field"><label>${k}</label><input data-upd="${i}" data-k="${k}" value="${esc(u[k]||'')}"></div>`).join('')}</div><button class="btn mini danger" data-del-upd="${i}">Excluir</button>`;up.appendChild(d)})}
function bind(){
 $$('[data-path]').forEach(el=>el.oninput=()=>{set(el.dataset.path,el.type==='checkbox'?el.checked:el.value);send()});
 $('#addCat')?.addEventListener('click',()=>{data.categories=data.categories||[];data.categories.push({id:'',code:'',name:'',short:'',desc:'',image:'',rules:[]});renderRules();send()});
 $('#addUpd')?.addEventListener('click',()=>{data.updates=data.updates||[];data.updates.push({date:'',title:'',text:'',tag:''});renderRules();send()});
 $$('[data-cat]').forEach(el=>el.oninput=()=>{data.categories[+el.dataset.cat][el.dataset.k]=el.value;send()});
 $$('[data-rule]').forEach(el=>el.oninput=()=>{let [i,j]=el.dataset.rule.split(':').map(Number);data.categories[i].rules[j][el.dataset.k]=el.value;send()});
 $$('[data-upd]').forEach(el=>el.oninput=()=>{data.updates[+el.dataset.upd][el.dataset.k]=el.value;send()});
 $$('[data-del-cat]').forEach(b=>b.onclick=()=>{data.categories.splice(+b.dataset.delCat,1);renderRules();send()});
 $$('[data-del-rule]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.delRule.split(':').map(Number);data.categories[i].rules.splice(j,1);renderRules();send()});
 $$('[data-del-upd]').forEach(b=>b.onclick=()=>{data.updates.splice(+b.dataset.delUpd,1);renderRules();send()});
 $$('[data-add-rule]').forEach(b=>b.onclick=()=>{let i=+b.dataset.addRule;data.categories[i].rules=data.categories[i].rules||[];data.categories[i].rules.push({code:'',title:'',text:'',tag:'REGRA',image:''});renderRules();send()});
}
function send(){const f=$('#preview');if(f?.contentWindow)f.contentWindow.postMessage({type:'viena-preview',site,data},'*');}
function notice(t){let n=$('#notice');n.textContent=t;n.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>n.classList.remove('show'),1800)}
function download(name,obj){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#panel-'+b.dataset.tab).classList.add('active')});
$('#preview').addEventListener('load',send);$('#loadBtn').onclick=()=>load();$('#draftBtn').onclick=()=>{localStorage.setItem('viena-editor-draft',JSON.stringify({site,data}));notice('Rascunho salvo neste navegador.');};$('#downloadBtn').onclick=()=>{download('site.json',site);download('rules.json',data);notice('2 JSONs baixados.');};$('#adminBtn').onclick=()=>location.href='admin/';
load();
</script></body></html>
